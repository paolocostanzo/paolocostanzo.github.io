name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by publish-scheduled.yml: a push made with GITHUB_TOKEN does not
  # trigger other workflows, so the scheduled merge has to invoke the deploy.
  # The caller passes the SHA it just pushed: github.sha would still point at
  # main as it was when the schedule fired, i.e. without the new post.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # false: never cancel a deploy that is already running — GitHub Pages does not
  # cope well with being interrupted mid-publication. Later pushes queue instead.
  group: "pages-deploy"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      # Refresh the Hack The Box card from the public profile at build time, so
      # nothing is committed to main (publish-scheduled.yml needs --ff-only).
      # On any API failure the committed card in assets/ is shipped unchanged.
      - name: Refresh HTB card
        run: python3 tools/htb_card.py || echo "::warning::HTB card not refreshed, shipping the committed one"
      # The site ships only HTML and its assets: tooling and repo-only files
      # stay out of the artifact (same rationale as .gitignore).
      - name: Strip non-publishable files
        run: rm -rf tools README.md .github .git
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
