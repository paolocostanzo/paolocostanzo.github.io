name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # false: never cancel a deploy that is already running — GitHub Pages does not
  # cope well with being interrupted mid-publication. Later pushes queue instead.
  group: "pages-deploy"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site ships only HTML and its assets: tooling and repo-only files
      # stay out of the artifact (same rationale as .gitignore).
      - name: Strip non-publishable files
        run: rm -rf tools README.md .github .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
